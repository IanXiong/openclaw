<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature 产物总览</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5; --primary-light: #eef2ff; --primary-hover: #4338ca;
      --success: #10b981; --success-light: #ecfdf5;
      --warning: #f59e0b; --warning-light: #fffbeb;
      --error: #ef4444; --error-light: #fef2f2;
      --info: #06b6d4; --info-light: #ecfeff;
      --purple: #8b5cf6; --purple-light: #f5f3ff;
      --pink: #ec4899; --pink-light: #fdf2f8;
      --g50: #f8fafc; --g100: #f1f5f9; --g200: #e2e8f0; --g300: #cbd5e1;
      --g400: #94a3b8; --g500: #64748b; --g600: #475569; --g700: #334155;
      --g800: #1e293b; --g900: #0f172a;
      --radius: 10px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--g100);
      color: var(--g800);
      -webkit-font-smoothing: antialiased;
    }
    
    .app-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
    }
    
    /* 顶部导航 */
    .top-nav {
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 50%, #7c3aed 100%);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 52px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(79,70,229,0.25);
      position: relative;
      z-index: 10;
    }
    
    .top-nav.p-phase {
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 50%, #7c3aed 100%);
      box-shadow: 0 4px 12px rgba(79,70,229,0.25);
    }
    
    .nav-badge {
      margin-left: 12px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.95);
      background: rgba(255,255,255,0.12);
      padding: 5px 14px;
      border-radius: 20px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .nav-title {
      font-size: 15px;
      font-weight: 700;
      margin-right: 28px;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    
    .nav-title::before { content: "📦"; margin-right: 8px; }
    
    .nav-tabs {
      display: flex;
      gap: 1px;
      height: 100%;
      overflow-x: auto;
      flex: 1;
      min-width: 0;
    }
    .nav-tabs::-webkit-scrollbar { height: 0; }
    
    .nav-tab {
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .nav-tab:hover {
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.06);
    }
    
    .nav-tab.active {
      color: #fff;
      background: rgba(255,255,255,0.1);
      border-bottom-color: #fff;
    }
    
    .nav-tab .tab-icon { margin-right: 6px; font-size: 14px; }
    
    .nav-tab.approved { border-top: 2px solid #34d399; }
    .nav-tab.in-progress { border-top: 2px solid #fbbf24; }
    .nav-tab.not-started { border-top: 2px solid rgba(255,255,255,0.2); }
    
    .nav-info {
      margin-left: auto;
      font-size: 11px;
      opacity: 0.5;
      white-space: nowrap;
    }
    
    /* 主内容区 */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .tab-content {
      display: none;
      flex: 1;
      overflow: hidden;
    }
    
    .tab-content.active { display: flex; }
    
    /* 侧边栏 */
    .sidebar {
      width: 280px;
      background: #fff;
      border-right: 1px solid var(--g200);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--g100);
      background: var(--g50);
    }
    
    .sidebar-header h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--g800);
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }
    
    .sidebar-stats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .stat-item {
      padding: 3px 10px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 500;
      border-radius: 4px;
      font-size: 11px;
    }
    
    .stat-item.success { background: var(--success-light); color: var(--success); }
    .stat-item.warning { background: var(--warning-light); color: var(--warning); }
    
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    
    /* 树形列表 */
    .tree-group { margin-bottom: 2px; }
    
    .tree-group-header {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    
    .tree-group-header:hover { background: var(--g50); }
    
    .tree-group-header .arrow {
      width: 16px;
      font-size: 10px;
      color: var(--g400);
      transition: transform 0.2s;
    }
    
    .tree-group-header.expanded .arrow { transform: rotate(90deg); }
    
    .tree-group-header .icon { margin-right: 8px; font-size: 14px; }
    
    .tree-group-header .name {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      color: var(--g700);
    }
    
    .tree-group-header .count {
      padding: 1px 7px;
      background: var(--g100);
      border-radius: 10px;
      font-size: 10px;
      color: var(--g400);
      font-weight: 500;
    }
    
    .tree-group-children {
      display: none;
      padding-left: 16px;
    }
    
    .tree-group.expanded > .tree-group-children { display: block; }
    
    .tree-item {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .tree-item:hover { background: var(--primary-light); }
    
    .tree-item.active {
      background: var(--primary-light);
      border-left: 2px solid var(--primary);
    }
    
    .tree-item .item-icon { margin-right: 8px; font-size: 12px; }
    
    .tree-item .item-name {
      flex: 1;
      font-size: 12px;
      color: var(--g600);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .tree-item.active .item-name {
      color: var(--primary);
      font-weight: 600;
    }
    
    .file-tag {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 6px;
      flex-shrink: 0;
    }
    
    .file-tag.md { background: var(--primary-light); color: var(--primary); }
    .file-tag.sql { background: var(--success-light); color: var(--success); }
    .file-tag.http { background: var(--warning-light); color: #d97706; }
    .file-tag.sh { background: var(--purple-light); color: var(--purple); }
    .file-tag.toon { background: var(--pink-light); color: var(--pink); }
    .file-tag.json { background: var(--info-light); color: var(--info); }
    
    /* 内容区 */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--g100);
    }
    
    .content-header {
      background: #fff;
      padding: 14px 24px;
      border-bottom: 1px solid var(--g200);
    }
    
    .content-breadcrumb {
      font-size: 11px;
      color: var(--g400);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    
    .content-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--g900);
      letter-spacing: -0.3px;
    }
    
    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    /* 卡片样式 */
    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--g200);
    }
    
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--g800);
      letter-spacing: -0.2px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--g100);
      display: flex;
      align-items: center;
    }
    
    .card-title .icon { margin-right: 8px; }
    
    /* Markdown 渲染样式 */
    .markdown-body { line-height: 1.75; font-size: 14px; color: var(--g700); }
    .markdown-body h1 { font-size: 24px; margin: 24px 0 14px; color: var(--g900); font-weight: 800; letter-spacing: -0.5px; }
    .markdown-body h2 { font-size: 18px; margin: 20px 0 10px; border-bottom: 2px solid var(--g100); padding-bottom: 8px; color: var(--g800); font-weight: 700; }
    .markdown-body h3 { font-size: 15px; margin: 14px 0 8px; }
    .markdown-body h4 { font-size: 14px; margin: 12px 0 6px; }
    .markdown-body p { margin: 10px 0; }
    .markdown-body ul, .markdown-body ol { margin: 10px 0; padding-left: 20px; }
    .markdown-body li { margin: 4px 0; }
    .markdown-body code { background: var(--g100); padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; color: var(--primary); }
    .markdown-body pre { background: var(--g900); padding: 16px; border-radius: 8px; overflow-x: auto; }
    .markdown-body pre code { background: none; padding: 0; color: #e2e8f0; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 12px; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--g200); padding: 8px 12px; }
    .markdown-body th { background: var(--g50); color: var(--g600); font-weight: 600; }
    .markdown-body blockquote { border-left: 3px solid var(--primary); padding: 12px 16px; margin: 14px 0; color: var(--g600); background: var(--primary-light); border-radius: 0 8px 8px 0; }
    .markdown-body img { max-width: 100%; border-radius: 4px; }
    .markdown-body hr { border: none; border-top: 1px solid #e8e8e8; margin: 20px 0; }
    .markdown-body .mermaid-wrapper { margin: 16px 0; }
    .markdown-body .mermaid { background: #fafafa; border-radius: 8px; padding: 20px; overflow-x: auto; }
    .markdown-body .mermaid svg { max-width: 100%; height: auto; }
    .markdown-body .mermaid-fallback { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 16px; margin: 0; overflow-x: auto; }
    .markdown-body .mermaid-fallback code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; line-height: 1.5; white-space: pre; color: #24292e; }
    
    /* 可筛选表格样式 */
    .filterable-table-wrapper { margin: 16px 0; }
    .table-filter-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .table-filter-input {
      padding: 6px 10px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 12px;
      min-width: 120px;
      outline: none;
    }
    .table-filter-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .table-filter-label { font-size: 12px; color: #8c8c8c; }
    .table-filter-clear {
      padding: 4px 10px;
      background: #f5f5f5;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      color: #595959;
    }
    .table-filter-clear:hover { background: #e8e8e8; }
    .table-row-hidden { display: none; }
    .table-filter-count { font-size: 11px; color: #8c8c8c; margin-left: auto; }
    
    /* 空状态 */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #bfbfbf;
    }
    
    .empty-state .icon { font-size: 56px; margin-bottom: 14px; }
    .empty-state .text { font-size: 14px; }
    
    /* 文档大纲样式 */
    .doc-outline {
      background: #fafafa;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid #f0f0f0;
    }
    .doc-outline-title {
      font-size: 12px;
      font-weight: 600;
      color: #8c8c8c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .doc-outline-title::before { content: "📑"; margin-right: 6px; }
    .doc-outline-title .toggle { margin-left: auto; font-size: 10px; color: #bfbfbf; }
    .doc-outline-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 200px;
      overflow-y: auto;
    }
    .doc-outline-list.collapsed { display: none; }
    .doc-outline-item {
      padding: 4px 0;
      font-size: 12px;
      color: #595959;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .doc-outline-item:hover { color: #1890ff; }
    .doc-outline-item.level-1 { padding-left: 0; font-weight: 500; }
    .doc-outline-item.level-2 { padding-left: 12px; }
    .doc-outline-item.level-3 { padding-left: 24px; font-size: 11px; }
    .doc-outline-item.level-4 { padding-left: 36px; font-size: 11px; color: #8c8c8c; }
    .doc-outline-item::before {
      content: "•";
      margin-right: 6px;
      color: #d9d9d9;
    }
    .doc-outline-item.level-1::before { content: "▸"; color: #1890ff; }
    .doc-outline-item.level-2::before { content: "◦"; }
    
    /* Front Matter 元数据样式 */
    .front-matter {
      background: linear-gradient(135deg, #f6f8fa 0%, #eef1f5 100%);
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .front-matter-title {
      font-size: 12px;
      font-weight: 600;
      color: #586069;
      margin-bottom: 8px;
    }
    .front-matter-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .front-matter-item {
      display: inline-flex;
      align-items: center;
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .fm-key {
      color: #6a737d;
      margin-right: 6px;
    }
    .fm-key::after { content: ":"; }
    .fm-value {
      color: #24292e;
      font-weight: 500;
    }
    
    /* 加载状态 */
    .loading {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8c8c8c;
    }
    
    .loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #f0f0f0;
      border-top-color: #1890ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 14px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* 代码预览样式 */
    .code-preview {
      background: #1e1e1e;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #d4d4d4;
    }
    
    /* TOON 格式样式 */
    .toon-container { font-size: 13px; }
    .toon-header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
      color: #fff;
      padding: 16px 20px;
      border-radius: 8px 8px 0 0;
      margin-bottom: 0;
    }
    .toon-header h3 { margin: 0 0 8px; font-size: 16px; }
    .toon-header .toon-meta { font-size: 11px; opacity: 0.85; }
    .toon-header .toon-meta span { margin-right: 16px; }
    .toon-section {
      background: #fff;
      border: 1px solid var(--g200);
      border-top: none;
      margin-bottom: 0;
    }
    .toon-section:last-child { border-radius: 0 0 8px 8px; }
    .toon-section-title {
      background: var(--g50);
      padding: 10px 20px;
      font-weight: 600;
      font-size: 13px;
      color: var(--g800);
      border-bottom: 1px solid var(--g100);
      cursor: pointer;
      display: flex;
      align-items: center;
      user-select: none;
    }
    .toon-section-title:hover { background: var(--g100); }
    .toon-section-title::before {
      content: "▶";
      font-size: 10px;
      margin-right: 10px;
      color: #8c8c8c;
      transition: transform 0.2s;
    }
    .toon-section.expanded .toon-section-title::before { transform: rotate(90deg); }
    .toon-section-title .badge {
      margin-left: auto;
      padding: 2px 8px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 10px;
      font-size: 11px;
      font-weight: normal;
    }
    .toon-section-content {
      display: none;
      padding: 16px 20px;
    }
    .toon-section.expanded .toon-section-content { display: block; }
    .toon-kv { display: flex; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; }
    .toon-kv:last-child { border-bottom: none; }
    .toon-kv-key { color: #8c8c8c; min-width: 180px; font-size: 12px; }
    .toon-kv-value { color: #262626; font-size: 12px; }
    .toon-nested-block { margin: 12px 0; background: #f8f9fa; border-radius: 8px; overflow: hidden; }
    .toon-nested-title { background: #e8f4fd; color: #1890ff; padding: 10px 14px; font-weight: 500; font-size: 13px; }
    .toon-nested-content { margin: 0; padding: 14px; font-size: 12px; line-height: 1.6; background: #f8f9fa; overflow-x: auto; white-space: pre; }
    .toon-nested-content code { font-family: 'SF Mono', Monaco, 'Courier New', monospace; color: #24292e; }
    .toon-list { margin: 0; padding: 0; list-style: none; }
    .toon-list-item {
      background: #fafafa;
      border: 1px solid #f0f0f0;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .toon-list-item:last-child { margin-bottom: 0; }
    .toon-list-item-header {
      font-weight: 600;
      color: #262626;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toon-list-item-header .id-badge {
      background: var(--primary);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
    .toon-list-item-header .name { flex: 1; }
    .toon-list-item-body { font-size: 12px; }
    .toon-list-item-body .toon-kv-key { min-width: 140px; }
    .toon-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      margin-left: 4px;
    }
    .toon-tag.success { background: var(--success-light); color: var(--success); }
    .toon-tag.warning { background: var(--warning-light); color: var(--warning); }
    .toon-tag.error { background: var(--error-light); color: var(--error); }
    .toon-tag.info { background: var(--info-light); color: var(--info); }
    .toon-tag.purple { background: var(--purple-light); color: var(--purple); }
    .toon-methods { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e8e8e8; }
    .toon-methods-title { font-size: 11px; color: #8c8c8c; margin-bottom: 6px; }
    .toon-method {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .toon-method:last-child { margin-bottom: 0; }
    .toon-method-name { font-weight: 600; color: #1890ff; font-family: monospace; }
    .toon-method-meta { color: #8c8c8c; margin-top: 4px; }
    .toon-comment { color: #8c8c8c; font-style: italic; padding: 4px 0; font-size: 12px; }
    
    /* TOON YAML 列表样式 */
    .toon-yaml-list { margin-bottom: 16px; }
    .toon-yaml-list-title {
      font-weight: 600;
      font-size: 13px;
      color: #262626;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toon-simple-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .toon-simple-list-item {
      background: #f8f9fa;
      border-left: 3px solid #1890ff;

    // ==================== 全局状态 ====================

    const phaseFiles = {}; // 缓存每个阶段检测到的文件
    let hubStatus = null; // 缓存 hub_status.json
    
    // 读取状态文件（P阶段读取 hub_status.json，S/T阶段读取 phase_status.json）
    async function loadHubStatus() {
      // 先尝试 hub_status.json（P阶段）
      try {
        const response = await fetch('hub_status.json');
        if (response.ok) {
          hubStatus = await response.json();
          return hubStatus;
        }
      } catch (e) {
        console.warn('Failed to load hub_status.json:', e);
      }
      // 再尝试 phase_status.json（S/T阶段）
      try {
        const response = await fetch('phase_status.json');
        if (response.ok) {
          hubStatus = await response.json();
          return hubStatus;
        }
      } catch (e) {
        console.warn('Failed to load phase_status.json:', e);
      }
      return hubStatus;
    }
    
    // 获取阶段状态
    function getPhaseStatus(phaseId) {
      if (!hubStatus || !hubStatus.phases) return null;
      // 尝试不同的 key 格式: P01, p01, P06-A, p06-a
      const keys = [phaseId.toUpperCase(), phaseId.toLowerCase(), phaseId.toUpperCase().replace('-', '-')];
      for (const key of keys) {
        if (hubStatus.phases[key]) return hubStatus.phases[key].status;
      }
      return null;
    }
    
    // ==================== 阶段检测 ====================
    async function fileExists(path) {
      try {
        const response = await fetch(path, { method: 'HEAD' });
        return response.ok;
      } catch (e) {
        return false;
      }
    }
    
    // 从 P04 execution_manifest.json 读取服务列表
    let cachedServices = null;
    async function getServicesFromManifest(baseDir) {
      if (cachedServices !== null) return cachedServices;
      try {
        const manifestPath = baseDir + 'P04_service_split/execution_manifest.json';
        const response = await fetch(manifestPath);
        if (response.ok) {
          const manifest = await response.json();
          const services = manifest.services || [];
          cachedServices = services.map(s => typeof s === 'string' ? s : (s.name || s.service_name || ''));
          return cachedServices;
        }
      } catch (e) {
        console.warn('Failed to load execution_manifest.json:', e);
      }
      cachedServices = [];
      return cachedServices;
    }
    
    async function detectPhases() {
      // 检测可能的目录结构
      // 1. Hub仓: docs/P01_xxx, docs/P02_xxx...
      // 2. 服务仓: S01_xxx, S02_xxx... 或 docs/features/xxx/S01_xxx...
      
      const pathsToTry = [
        { base: 'docs/', phases: P_PHASES_CONFIG, type: 'p' },
        { base: '', phases: S_PHASES_CONFIG, type: 's' },
        { base: '', phases: P_PHASES_CONFIG, type: 'p' }
      ];
      
      for (const config of pathsToTry) {
        const phases = Object.values(config.phases);
        // 检测是否有任意一个阶段存在文件
        let hasAnyFile = false;
        for (const phase of phases) {
          for (const group of phase.groups) {
            for (const file of (group.files || [])) {
              if (!file.pattern) {
                const exists = await fileExists(config.base + phase.dir + '/' + file.path);
                if (exists) {
                  hasAnyFile = true;
                  break;
                }
              }
            }
            if (hasAnyFile) break;
          }
          if (hasAnyFile) break;
        }
        
        // 如果检测到任意文件，返回该配置下的所有阶段（无论是否有文件）
        if (hasAnyFile) {
          phaseType = config.type;
          baseDir = config.base;
          detectedPhases = phases.map(phase => ({ ...phase, baseDir: config.base }));
          return detectedPhases;
        }
      }
      
      // 没有检测到，返回空
      return [];
    }

    async function scanFilesInPhase(phase) {
      const files = [];
      
      for (const group of phase.groups) {
        const groupFiles = [];
        
        // 添加预定义文件
        if (group.files) {
          for (const file of group.files) {
            if (!file.pattern) {
              const exists = await fileExists(phase.baseDir + phase.dir + '/' + file.path);
              if (exists) {
                groupFiles.push({ ...file, fullPath: phase.baseDir + phase.dir + '/' + file.path });
              }
            }
          }
        }
        
        // 扫描目录（通过尝试常见文件名或从索引文件提取）
        if (group.scanDir !== undefined) {
          const scanBase = phase.baseDir + phase.dir + '/' + (group.scanDir ? group.scanDir + '/' : '');
          const patterns = (group.scanPattern || '').split(',');
          
          // 扫描图片文件 - 从 assets_summary.md 中提取图片路径
          if (group.scanImages) {
            const summaryPath = phase.baseDir + phase.dir + '/assets_summary.md';
            const summaryContent = await loadTextFile(summaryPath);
            if (summaryContent) {
              // 从 markdown 表格中提取图片路径，格式如: | `source_export/static/xxx.png` |
              const imgRegex = /`(source_export\/static\/[^`]+)`/g;
              let match;
              while ((match = imgRegex.exec(summaryContent)) !== null) {
                const imgPath = match[1];
                const fileName = imgPath.split('/').pop();
                const ext = fileName.split('.').pop().toLowerCase();
                if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
                  const fullPath = phase.baseDir + phase.dir + '/' + imgPath;
                  const exists = await fileExists(fullPath);
                  if (exists) {
                    const id = fileName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                    if (!groupFiles.find(f => f.id === id)) {
                      groupFiles.push({
                        id,
                        name: fileName,
                        path: imgPath,
                        fullPath,
                        type: 'image'
                      });
                    }
                  }
                }
              }
            }
          }
          
          // 如果有索引文件，从索引文件中提取文件列表
          if (group.indexFile) {
            const indexPath = phase.baseDir + phase.dir + '/' + group.indexFile;
            const indexContent = await loadTextFile(indexPath);
            if (indexContent) {
              // 从 markdown 中提取链接，格式如: [查看](assets_analysis/xxx.md)
              const linkRegex = /\[.*?\]\(([^)]+)\)/g;
              let match;
              while ((match = linkRegex.exec(indexContent)) !== null) {
                const linkPath = match[1];
                // 检查是否在目标目录下
                if (linkPath.startsWith(group.scanDir + '/')) {
                  const fileName = linkPath.split('/').pop();
                  const ext = fileName.split('.').pop();
                  const fullPath = phase.baseDir + phase.dir + '/' + linkPath;
                  const exists = await fileExists(fullPath);
                  if (exists) {
                    const id = fileName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                    // 避免重复
                    if (!groupFiles.find(f => f.id === id)) {
                      groupFiles.push({
                        id,
                        name: fileName.replace('.md', '').replace('.json', ''),
                        path: linkPath,
                        fullPath,
                        type: ext
                      });
                    }
                  }
                }
              }
            }
          }
          
          // 从 PRD.md 的 front matter 中读取 source 字段获取飞书原文文件名
          if (group.scanFromPRD) {
            const prdPath = phase.baseDir + phase.dir + '/PRD.md';
            const prdContent = await loadTextFile(prdPath);
            if (prdContent) {
              // 解析 front matter 中的 source 字段
              const sourceMatch = prdContent.match(/^---[\s\S]*?source:\s*(.+?)[\r\n][\s\S]*?---/m);
              if (sourceMatch) {
                const sourceFile = sourceMatch[1].trim();
                const fullPath = scanBase + sourceFile;
                const exists = await fileExists(fullPath);
                if (exists) {
                  groupFiles.push({
                    id: 'source_prd',
                    name: '飞书原文',
                    path: group.scanDir + '/' + sourceFile,
                    fullPath,
                    type: 'md'
                  });
                }
              }
            }
            
            // 扫描 download_report 开头的文件 - 从 metadata.json 中读取下载时间
            const metadataPath = phase.baseDir + phase.dir + '/metadata.json';
            const metadataContent = await loadTextFile(metadataPath);
            if (metadataContent) {
              try {
                const metadata = JSON.parse(metadataContent);
                // 从 download_time 字段提取日期时间
                if (metadata.download_time) {
                  const dt = new Date(metadata.download_time);
                  const dateStr = dt.toISOString().slice(0, 10).replace(/-/g, '');
                  const timeStr = dt.toTimeString().slice(0, 8).replace(/:/g, '');
                  const reportName = `download_report_${dateStr}_${timeStr}.md`;
                  const fullPath = scanBase + reportName;
                  const exists = await fileExists(fullPath);
                  if (exists && !groupFiles.find(f => f.id === 'download_report')) {
                    groupFiles.push({
                      id: 'download_report',
                      name: '下载报告',
                      path: group.scanDir + '/' + reportName,
                      fullPath,
                      type: 'md'
                    });
                  }
                }
              } catch (e) {
                console.warn('Failed to parse metadata.json:', e);
              }
            }
          }
          
          // 预定义的常见文件名
          const commonNames = [
            'README.md', 'index.md', 'main.md',
            // Task 日志文件 - 支持有无前导零两种格式
            ...Array.from({length: 20}, (_, i) => `Task_BE-${String(i+1).padStart(2, '0')}_Log.md`),
            ...Array.from({length: 20}, (_, i) => `Task_BE-${i+1}_Log.md`),
            ...Array.from({length: 10}, (_, i) => `Task_DATA-${String(i+1).padStart(2, '0')}_Log.md`),
            ...Array.from({length: 10}, (_, i) => `Task_DATA-${i+1}_Log.md`),
            // 特殊格式的任务日志
            'Task_BE-13_to_BE-19_Log.md', 'Task_BE-20_to_BE-25_Log.md',
            // 测试用例 - 支持多种命名格式
            ...Array.from({length: 20}, (_, i) => `test_case_${String(i+1).padStart(2, '0')}.http`),
            ...Array.from({length: 20}, (_, i) => `test_case_${i+1}.http`),
            // 带后缀名称的测试用例
            'test_case_01_recommend.http', 'test_case_02_patrol.http', 'test_case_03_pass_immediately.http',
            'test_case_04_strategy.http', 'test_case_05_shortage.http', 'test_case_06_feishu_category.http',
            'test_case_07_feishu_area.http', 'test_case_08_display.http', 'test_case_09_detail.http',
            'test_case_10_patrol_fail.http', 'test_case_11_job.sh',
            'test_data_preparation.sql', 'test_data_cleanup.sql',
            // API 文档
            'API-001.md', 'API-002.md', 'API-003.md', 'API-004.md', 'API-005.md',
            'API-006.md', 'API-007.md', 'API-008.md', 'API-009.md', 'API-010.md',
            'API-011.md', 'API-012.md', 'API-013.md', 'API-014.md', 'API-015.md'
          ];
          
          for (const name of commonNames) {
            if (name.includes('*')) continue; // 跳过通配符
            const ext = name.split('.').pop();
            // 检查是否匹配模式：支持 *.ext 和 prefix_*.ext 格式
            const matchesPattern = patterns.some(p => {
              const trimmed = p.trim();
              if (trimmed === '*.' + ext) return true;
              // 支持 Task_*.md 这种前缀模式
              if (trimmed.includes('*')) {
                const prefix = trimmed.split('*')[0];
                const suffix = trimmed.split('*')[1] || '';
                return name.startsWith(prefix) && name.endsWith(suffix);
              }
              return false;
            });
            if (matchesPattern) {
              const fullPath = scanBase + name;
              const exists = await fileExists(fullPath);
              if (exists) {
                const id = name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                // 避免重复
                if (!groupFiles.find(f => f.id === id)) {
                  groupFiles.push({
                    id,
                    name: name.replace(/\.(md|sql|http|sh|json|toon)$/, ''),
                    path: (group.scanDir ? group.scanDir + '/' : '') + name,
                    fullPath,
                    type: ext
                  });
                }
              }
            }
          }
        }
        
        // 处理动态服务发现
        let processedSubgroups = [];
        if (group.dynamicServices) {
          const services = await getServicesFromManifest(phase.baseDir);
          for (const serviceName of services) {
            const subgroupFiles = [];
            
            // 根据模板生成文件列表
            if (group.serviceFilesTemplate) {
              for (const template of group.serviceFilesTemplate) {
                const path = template.pathTemplate.replace('{service}', serviceName);
                const fullPath = phase.baseDir + phase.dir + '/' + path;
                const exists = await fileExists(fullPath);
                if (exists) {
                  subgroupFiles.push({
                    id: template.id + '_' + serviceName.replace(/[^a-zA-Z0-9]/g, '_'),
                    name: template.name,
                    path: path,
                    fullPath: fullPath,
                    type: template.type
                  });
                }
              }
            }
            
            // 根据模板扫描目录
            if (group.serviceScanTemplate) {
              const scanDir = group.serviceScanTemplate.scanDir.replace('{service}', serviceName);
              const scanBase = phase.baseDir + phase.dir + '/' + scanDir + '/';
              const patterns = (group.serviceScanTemplate.scanPattern || '').split(',');
              const commonNames = [
                'test_case_01_recommend.http', 'test_case_02_patrol.http', 'test_case_03_pass_immediately.http',
                'test_case_04_strategy.http', 'test_case_05_shortage.http', 'test_case_06_feishu_category.http',
                'test_case_07_feishu_area.http', 'test_case_08_display.http', 'test_case_09_detail.http',
                'test_case_10_patrol_fail.http', 'test_case_11_job.sh',
                'test_data_preparation.sql', 'test_data_cleanup.sql'
              ];
              for (const name of commonNames) {
                const ext = name.split('.').pop();
                const matchesPattern = patterns.some(p => {
                  const trimmed = p.trim();
                  if (trimmed === '*.' + ext) return true;
                  return false;
                });
                if (matchesPattern) {
                  const fullPath = scanBase + name;
                  const exists = await fileExists(fullPath);
                  if (exists) {
                    const id = name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                    if (!subgroupFiles.find(f => f.id === id)) {
                      subgroupFiles.push({
                        id,
                        name: name.replace(/\.(md|sql|http|sh|json|toon)$/, ''),
                        path: scanDir + '/' + name,
                        fullPath,
                        type: ext
                      });
                    }
                  }
                }
              }
            }
            
            if (subgroupFiles.length > 0) {
              processedSubgroups.push({
                name: serviceName,
                icon: '📦',
                files: subgroupFiles
              });
            }
          }
        }
        
        // 处理静态 subgroups
        if (group.subgroups) {
          for (const subgroup of group.subgroups) {
            const subgroupFiles = [];
            
            // 添加子分组的预定义文件
            if (subgroup.files) {
              for (const file of subgroup.files) {
                const exists = await fileExists(phase.baseDir + phase.dir + '/' + file.path);
                if (exists) {
                  subgroupFiles.push({ ...file, fullPath: phase.baseDir + phase.dir + '/' + file.path });
                }
              }
            }
            
            // 扫描图片文件 - 从 assets_summary.md 中提取图片路径
            if (subgroup.scanImages) {
              const summaryPath = phase.baseDir + phase.dir + '/assets_summary.md';
              const summaryContent = await loadTextFile(summaryPath);
              if (summaryContent) {
                // 从 assets_summary.md 中提取 source_export/static/ 下的图片路径
                const imgRegex = /source_export\/static\/([^\s`|)]+\.(png|jpg|jpeg|gif|webp))/gi;
                let match;
                const seenImages = new Set();
                while ((match = imgRegex.exec(summaryContent)) !== null) {
                  const imgName = match[1];
                  if (seenImages.has(imgName)) continue;
                  seenImages.add(imgName);
                  const fullPath = phase.baseDir + phase.dir + '/source_export/static/' + imgName;
                  const ext = imgName.split('.').pop().toLowerCase();
                  subgroupFiles.push({
                    id: 'img_' + imgName.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase(),
                    name: imgName,
                    path: 'source_export/static/' + imgName,
                    fullPath,
                    type: ext
                  });
                }
              }
            }
            
            // 子分组的目录扫描
            if (subgroup.scanDir !== undefined && !subgroup.scanImages) {
              const scanBase = phase.baseDir + phase.dir + '/' + (subgroup.scanDir ? subgroup.scanDir + '/' : '');
              const patterns = (subgroup.scanPattern || '').split(',');
              const commonNames = [
                'test_case_01_recommend.http', 'test_case_02_patrol.http', 'test_case_03_pass_immediately.http',
                'test_case_04_strategy.http', 'test_case_05_shortage.http', 'test_case_06_feishu_category.http',
                'test_case_07_feishu_area.http', 'test_case_08_display.http', 'test_case_09_detail.http',
                'test_case_10_patrol_fail.http', 'test_case_11_job.sh',
                'test_data_preparation.sql', 'test_data_cleanup.sql'
              ];
              for (const name of commonNames) {
                const ext = name.split('.').pop();
                const matchesPattern = patterns.some(p => {
                  const trimmed = p.trim();
                  if (trimmed === '*.' + ext) return true;
                  return false;
                });
                if (matchesPattern) {
                  const fullPath = scanBase + name;
                  const exists = await fileExists(fullPath);
                  if (exists) {
                    const id = name.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
                    if (!subgroupFiles.find(f => f.id === id)) {
                      subgroupFiles.push({
                        id,
                        name: name.replace(/\.(md|sql|http|sh|json|toon)$/, ''),
                        path: (subgroup.scanDir ? subgroup.scanDir + '/' : '') + name,
                        fullPath,
                        type: ext
                      });
                    }
                  }
                }
              }
            }
            
            if (subgroupFiles.length > 0) {
              processedSubgroups.push({ ...subgroup, files: subgroupFiles });
            }
          }
        }
        
        if (groupFiles.length > 0 || processedSubgroups.length > 0) {
          files.push({ ...group, files: groupFiles, subgroups: processedSubgroups });
        }
      }
      
      return files;
    }
    
    // ==================== UI 生成 ====================
    function generateNavTabs() {
      const navTabs = document.getElementById('nav-tabs');
      const topNav = document.getElementById('top-nav');
      const navTitle = document.getElementById('nav-title');
      const navInfo = document.getElementById('nav-info');
      
      if (phaseType === 'p') {
        topNav.classList.add('p-phase');
        navTitle.textContent = '需求Hub - 产物总览';
      } else {
        navTitle.textContent = '服务开发 - 产物总览';
      }
      
      // 从路径获取 feature 名称
      const pathParts = window.location.pathname.split('/');
      const featureIdx = pathParts.findIndex(p => p.startsWith('feature'));
      navInfo.textContent = featureIdx >= 0 ? pathParts[featureIdx] : pathParts[pathParts.length - 2] || '';
      
      navTabs.innerHTML = detectedPhases.map((phase, idx) => {
        const status = getPhaseStatus(phase.id);
        const statusClass = status === 'approved' ? 'approved' : (status === 'in_progress' || status === 'pending_review' ? 'in-progress' : 'not-started');
        return `
          <div class="nav-tab ${statusClass} ${idx === 0 ? 'active' : ''}" data-tab="${phase.id}">
            <span class="tab-icon">${phase.icon}</span>${phase.name}
          </div>
        `;
      }).join('');
      
      navTabs.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
      });
    }
    
    // 获取阶段状态文本
    function getPhaseStatusText(phaseId) {
      const status = getPhaseStatus(phaseId);
      if (status === 'approved') return '已完成';
      if (status === 'in_progress') return '进行中';
      if (status === 'pending_review') return '待审核';
      return '未开始';
    }
    
    function generateTabContents() {
      const mainContainer = document.getElementById('main-container');
      
      mainContainer.innerHTML = detectedPhases.map((phase, idx) => {
        const status = getPhaseStatus(phase.id);
        const statusText = getPhaseStatusText(phase.id);
        const statusClass = status === 'approved' ? 'success' : '';
        return `
          <div class="tab-content ${idx === 0 ? 'active' : ''}" id="tab-${phase.id}">
            <div class="sidebar">
              <div class="sidebar-header">
                <h3>${phase.icon} ${phase.name}</h3>
                <div class="sidebar-stats">
                  <span class="stat-item ${statusClass}">${statusText}</span>
                </div>
              </div>
              <div class="sidebar-content" id="${phase.id}-tree"></div>
            </div>
            <div class="content-area">
              <div class="content-header">
                <div class="content-breadcrumb">${phase.name}</div>
                <h2 class="content-title" id="${phase.id}-title">加载中...</h2>
              </div>
              <div class="content-body" id="${phase.id}-content">
                <div class="loading"><div class="spinner"></div><div>加载中...</div></div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    async function initPhaseTree(phase) {
      const tree = document.getElementById(phase.id + '-tree');
      if (!tree) return;
      
      // 扫描并获取实际存在的文件
      const groups = await scanFilesInPhase(phase);
      phaseFiles[phase.id] = groups;
      
      // 处理仅下载阶段的特殊提示
      if (phase.downloadOnly) {
        // 左侧目录显示空状态
        tree.innerHTML = '<div class="empty-state"><div class="icon">📦</div><div class="text">暂无文件</div></div>';
        // 内容区显示提示
        const content = document.getElementById(phase.id + '-content');
        const title = document.getElementById(phase.id + '-title');
        if (title) title.textContent = '本地查看';
        if (content) {
          content.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;">
            <div style="text-align:center;padding:60px;">
              <div style="font-size:72px;margin-bottom:24px;">📦</div>
              <div style="font-size:16px;color:#666;line-height:1.8;">${phase.downloadHint || 'P02仅导入知识库，不生成分析产物。'}</div>
            </div>
          </div>`;
        }
        return;
      }
      
      if (groups.length === 0) {
        tree.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div class="text">暂无文件</div></div>';
        const content = document.getElementById(phase.id + '-content');
        const title = document.getElementById(phase.id + '-title');
        if (content) content.innerHTML = '<div class="empty-state" style="height:100%;display:flex;align-items:center;justify-content:center"><div style="text-align:center"><div style="font-size:48px;margin-bottom:16px">📭</div><div style="color:#999;font-size:14px">该阶段暂无产出物</div></div></div>';
        if (title) title.textContent = '暂无产出物';
        return;
      }
      
      let isFirst = true;
      
      // 渲染文件项的辅助函数
      function renderFileItem(file, phaseId, indent = 0) {
        const active = isFirst ? 'active' : '';
        isFirst = false;
        const paddingLeft = indent > 0 ? `style="padding-left:${16 + indent * 16}px"` : '';
        return `
          <div class="tree-item ${active}" data-id="${file.id}" data-path="${file.fullPath}" onclick="showPhaseContent('${phaseId}', '${file.id}')" ${paddingLeft}>
            <span class="item-icon">📄</span>
            <span class="item-name">${file.name}</span>
            <span class="file-tag ${file.type}">${file.type.toUpperCase()}</span>
          </div>
        `;
      }
      
      // 渲染子分组的辅助函数
      function renderSubgroup(subgroup, phaseId) {
        const fileCount = (subgroup.files || []).length;
        return `
          <div class="tree-group">
            <div class="tree-group-header" onclick="this.parentElement.classList.toggle('expanded'); this.classList.toggle('expanded')">
              <span class="arrow">▶</span>
              <span class="icon">${subgroup.icon || '📁'}</span>
              <span class="name">${subgroup.name}</span>
              <span class="count">${fileCount}</span>
            </div>
            <div class="tree-group-children">
              ${(subgroup.files || []).map(file => renderFileItem(file, phaseId, 1)).join('')}
            </div>
          </div>
        `;
      }
      
      tree.innerHTML = groups.map(group => {
        // noGroup: true 时直接渲染文件项，不包装分组
        if (group.noGroup) {
          return (group.files || []).map(file => renderFileItem(file, phase.id)).join('');
        }
        
        // 计算总文件数（包括子分组中的文件）
        let totalFiles = (group.files || []).length;
        if (group.subgroups) {
          group.subgroups.forEach(sg => totalFiles += (sg.files || []).length);
        }
        
        const groupHtml = `
          <div class="tree-group">
            <div class="tree-group-header" onclick="this.parentElement.classList.toggle('expanded'); this.classList.toggle('expanded')">
              <span class="arrow">▶</span>
              <span class="icon">${group.icon}</span>
              <span class="name">${group.name}</span>
              <span class="count">${totalFiles}</span>
            </div>
            <div class="tree-group-children">
              ${(group.files || []).map(file => renderFileItem(file, phase.id)).join('')}
              ${(group.subgroups || []).map(sg => renderSubgroup(sg, phase.id)).join('')}
            </div>
          </div>
        `;
        return groupHtml;
      }).join('');
    }
    
    // ==================== Tab 切换 ====================
    function switchTab(tabId) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      const tab = document.querySelector(`.nav-tab[data-tab="${tabId}"]`);
      const content = document.getElementById('tab-' + tabId);
      
      if (tab && content) {
        tab.classList.add('active');
        content.classList.add('active');
        history.replaceState(null, '', '#' + tabId);
        
        if (!tabInitialized[tabId]) {
          tabInitialized[tabId] = true;
          const phase = detectedPhases.find(p => p.id === tabId);
          if (phase) {
            initPhaseTree(phase).then(() => {
              // 加载第一个文件（优先直接文件，其次子分组中的文件）
              const groups = phaseFiles[tabId];
              if (groups && groups.length > 0) {
                let firstFile = null;
                for (const g of groups) {
                  if (g.files && g.files.length > 0) { firstFile = g.files[0]; break; }
                  if (g.subgroups) {
                    for (const sg of g.subgroups) {
                      if (sg.files && sg.files.length > 0) { firstFile = sg.files[0]; break; }
                    }
                    if (firstFile) break;
                  }
                }
                if (firstFile) showPhaseContent(tabId, firstFile.id);
              }
            });
          }
        }
      }
    }
    
    function getTabFromHash() {
      const hash = window.location.hash.slice(1);
      if (hash && detectedPhases.find(p => p.id === hash)) {
        return hash;
      }
      return detectedPhases[0]?.id || 's01';
    }
    
    window.addEventListener('hashchange', () => {
      switchTab(getTabFromHash());
    });
    
    // 内部文件跳转 - 点击 md 链接时在当前页面展示内容
    async function navigateToFile(fullPath) {
      // 查找该文件属于哪个 phase 和 fileId（包括 subgroups）
      for (const phaseId in phaseFiles) {
        const groups = phaseFiles[phaseId];
        for (const group of groups || []) {
          let file = (group.files || []).find(f => f.fullPath === fullPath);
          if (!file && group.subgroups) {
            for (const sg of group.subgroups) {
              file = (sg.files || []).find(f => f.fullPath === fullPath);
              if (file) break;
            }
          }
          if (file) {
            // 切换到对应 tab
            switchTab(phaseId);
            // 展示内容
