    // ==================== Markdown 渲染 ====================
    function extractOutline(content) {
      const headings = [];
      const lines = content.split('\n');
      
      lines.forEach((line, index) => {
        const match = line.match(/^(#{1,4})\s+(.+)$/);
        if (match) {
          const level = match[1].length;
          const text = match[2].replace(/[*_`]/g, '').trim();
          const id = 'heading-' + index + '-' + text.replace(/[^\w\u4e00-\u9fa5]/g, '-').toLowerCase();
          headings.push({ level, text, id });
        }
      });
      
      return headings;
    }
    
    function generateOutlineHtml(headings) {
      if (headings.length === 0) return '';
      
      let html = `
        <div class="doc-outline">
          <div class="doc-outline-title" onclick="this.nextElementSibling.classList.toggle('collapsed'); this.querySelector('.toggle').textContent = this.nextElementSibling.classList.contains('collapsed') ? '展开' : '收起'">
            文档大纲 (${headings.length})
            <span class="toggle">收起</span>
          </div>
          <ul class="doc-outline-list">
      `;
      
      headings.forEach(h => {
        html += `<li class="doc-outline-item level-${h.level}" onclick="scrollToHeading('${h.id}')">${h.text}</li>`;
      });
      
      html += '</ul></div>';
      return html;
    }
    
    function scrollToHeading(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.style.background = '#fff7e6';
        setTimeout(() => { el.style.background = ''; }, 2000);
      }
    }
    
    function renderMarkdown(result) {
      if (!result) return '<div class="empty-state"><div class="icon">⚠️</div><div class="text">内容加载失败</div></div>';
      
      let { content, basePath } = result;
      
      // 处理 YAML front matter
      let frontMatterHtml = '';
      if (content.startsWith('---')) {
        const lines = content.split(/\r?\n/);
        let endIdx = -1;
        for (let i = 1; i < lines.length; i++) {
          if (lines[i].trim() === '---') {
            endIdx = i;
            break;
          }
        }
        if (endIdx > 0) {
          const fmLines = lines.slice(1, endIdx);
          content = lines.slice(endIdx + 1).join('\n');
          if (fmLines.length > 0) {
            frontMatterHtml = '<div class="front-matter"><div class="front-matter-title">📋 文档元数据</div><div class="front-matter-items">';
            fmLines.forEach(line => {
              const colonIdx = line.indexOf(':');
              if (colonIdx > 0) {
                const key = line.slice(0, colonIdx).trim();
                const value = line.slice(colonIdx + 1).trim();
                if (key && value) {
                  frontMatterHtml += `<span class="front-matter-item"><span class="fm-key">${escapeHtml(key)}</span><span class="fm-value">${escapeHtml(value)}</span></span>`;
                }
              }
            });
            frontMatterHtml += '</div></div>';
          }
        }
      }
      
      const headings = extractOutline(content);
      const outlineHtml = generateOutlineHtml(headings);
      
      let html = marked.parse(content);
      
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      
      let headingIdx = 0;
      tempDiv.querySelectorAll('h1, h2, h3, h4').forEach(heading => {
        if (headingIdx < headings.length) {
          heading.id = headings[headingIdx].id;
          headingIdx++;
        }
      });
      
      html = tempDiv.innerHTML;
      
      // 处理 Mermaid - 保存原始代码用于渲染失败时回退显示
      html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (match, code) => {
        const decoded = code.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"');
        const escapedCode = escapeHtml(decoded);
        return `<div class="mermaid-wrapper" data-original="${encodeURIComponent(decoded)}"><div class="mermaid">${decoded}</div></div>`;
      });
      
      // 修复相对路径 - 图片
      html = html.replace(/src="([^"]+)"/g, (match, src) => {
        if (src.startsWith('http://') || src.startsWith('https://') || src.startsWith('/')) {
          return match;
        }
        return `src="${basePath}${src}"`;
      });
      
      // 修复相对路径 - 链接（本地 .md 文件链接改为内部跳转）
      html = html.replace(/href="([^"]+\.md)"/g, (match, href) => {
        if (href.startsWith('http://') || href.startsWith('https://')) {
          return match;
        }
        const fullPath = basePath + href;
        return `href="javascript:void(0)" onclick="navigateToFile('${fullPath}')"`;
      });
      
      setTimeout(async () => {
        // 逐个渲染 Mermaid，使用 mermaid.render 可以捕获错误
        for (const wrapper of document.querySelectorAll('.mermaid-wrapper')) {
          const mermaidDiv = wrapper.querySelector('.mermaid');
          const originalCode = decodeURIComponent(wrapper.dataset.original || '');
          const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
          
          try {
            const { svg } = await mermaid.render(id, originalCode);
            mermaidDiv.innerHTML = svg;
          } catch (e) {
            // 渲染失败，显示原始代码
            console.warn('Mermaid render failed:', e.message);
            wrapper.innerHTML = `<pre class="mermaid-fallback"><code class="language-mermaid">${escapeHtml(originalCode)}</code></pre>`;
          }
        }
        
        enhanceTables();
        
        // 增强资产汇总表格（P01 assets_summary.md）
        document.querySelectorAll('.markdown-body').forEach(container => {
          enhanceAssetTable(container);
        });
      }, 100);
      
      return frontMatterHtml + outlineHtml + '<div class="markdown-body">' + html + '</div>';
    }
    
    function renderCodeFile(content, language) {
      if (!content) return '<div class="empty-state"><div class="icon">⚠️</div><div class="text">内容加载失败</div></div>';
      
      return `
        <div class="card">
          <div class="card-title"><span class="icon">📄</span>文件内容</div>
          <pre class="code-preview"><code>${escapeHtml(content)}</code></pre>
        </div>
      `;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // ==================== TOON 格式解析 ====================
    function parseToon(content) {
      const result = { comments: [], metadata: {}, sections: [] };
      const lines = content.split('\n');
      let currentSection = null;
      let currentItem = null;
      let currentSubKey = null;
      let currentSubItem = null; // 当前子列表项（如 methods 中的某个方法）
      let currentTableDef = null; // 当前表格定义 {name, fields, items}
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();
        
        // 跳过空行
        if (!trimmed) continue;
        
        // 顶级注释
        if (trimmed.startsWith('#') && !trimmed.startsWith('##')) {
          if (!currentSection) {
            const commentText = trimmed.substring(1).trim();
            // 跳过装饰性分隔线（如 ==================== CHAPTER_1: ... ====================）
            if (!commentText.match(/^=+/) && !commentText.match(/=+$/)) {
              result.comments.push(commentText);
            }
          }
          continue;
        }
        
        // 子章节标题 ### SUBSECTION_NAME
        if (trimmed.startsWith('### ')) {
          const subName = trimmed.substring(4).trim();
          if (currentSection) {
            // 作为一个特殊的分隔项
            currentSection.items.push({ _type: 'subsection', _title: subName });
          }
          currentTableDef = null;
          currentItem = null;
          continue;
        }
        
        // 章节标题 ## SECTION_NAME: 或 SECTION_NAME: (顶级，无缩进)
        if (trimmed.startsWith('## ') && trimmed.endsWith(':')) {
          const sectionName = trimmed.substring(3, trimmed.length - 1);
          currentSection = { name: sectionName, items: [], kvs: [], tables: [] };
          result.sections.push(currentSection);
          currentItem = null;
          currentSubKey = null;
          currentTableDef = null;
          continue;
        }
        
        // 顶级表格定义（无缩进，如 MODULES[N]{...}:）- 必须在章节标题判断之前！
        if (line.search(/\S/) === 0) {
          const topTableMatch = trimmed.match(/^([\w_]+)\[(\d+|N)\]\{([^}]+)\}:$/);
          if (topTableMatch) {
            const [, tableName, countStr, fieldsStr] = topTableMatch;
            const count = countStr === 'N' ? -1 : parseInt(countStr);
            const fields = fieldsStr.split(',').map(f => f.trim());
            // 创建新章节并添加表格
            currentSection = { name: tableName, items: [], kvs: [], tables: [] };
            result.sections.push(currentSection);
            currentTableDef = { name: tableName, count, fields, items: [], indent: 0 };
            currentSection.tables.push(currentTableDef);
            currentItem = null;
            currentSubKey = null;
            continue;
          }
          // 混合格式表格定义（无{fields}，如 function_assignments[26]:）
          const topMixedMatch = trimmed.match(/^([\w_]+)\[(\d+|N)\]:$/);
          if (topMixedMatch) {
            const [, tableName, countStr] = topMixedMatch;
            currentSection = { name: tableName, items: [], kvs: [], tables: [], _mixed: true };
            result.sections.push(currentSection);
            currentTableDef = null;
            currentItem = null;
            currentSubKey = null;
            // 解析混合格式内容块
            let j = i + 1;
            let currentGroup = null;
            while (j < lines.length) {
              const nextLine = lines[j];
              const nextTrimmed = nextLine.trim();
              if (nextTrimmed === '') { j++; continue; }
              const nextIndent = nextLine.search(/\S/);
              if (nextIndent === 0 && !nextTrimmed.startsWith('#')) break;
              if (nextTrimmed.startsWith('#')) { j++; continue; }
              // 多服务分组行: F1.6,取消上报异常[2]:
              const groupMatch = nextTrimmed.match(/^(.+?)\[(\d+)\]:$/);
              if (groupMatch && nextIndent > 0 && !nextTrimmed.startsWith('- ')) {
                const groupParts = groupMatch[1].split(',').map(p => p.trim());
                currentGroup = { _type: 'multi', _id: groupParts[0] || '', _name: groupParts[1] || '', _count: parseInt(groupMatch[2]), _services: [] };
                currentSection.items.push(currentGroup);
                j++;
                continue;
              }
              // 子服务行: - service,role,action,...
              if (nextTrimmed.startsWith('- ') && currentGroup) {
                const subContent = nextTrimmed.substring(2);
                const subParts = subContent.split(',').map(p => p.trim());
                currentGroup._services.push({ service: subParts[0] || '', role: subParts[1] || '', action: subParts[2] || '', domain: subParts[3] || '', workflow: subParts[4] || '' });
                j++;
                continue;
              }
              // 单服务行: F1.1,异常类型选择,service,role,action,domain,workflow
              if (nextIndent > 0 && !nextTrimmed.startsWith('- ')) {
                currentGroup = null;
                const parts = nextTrimmed.split(',').map(p => p.trim());
                if (parts.length >= 2) {
                  currentSection.items.push({ _type: 'single', _id: parts[0], _name: parts[1], service: parts[2] || '', role: parts[3] || '', action: parts[4] || '', domain: parts[5] || '', workflow: parts[6] || '' });
                }
                j++;
                continue;
              }
              break;
            }
            i = j - 1;
            continue;
          }
        }
        
        // 顶级章节标题（无缩进，以冒号结尾，如 META:, PRD_CONTEXT:）
        if (line.search(/\S/) === 0 && trimmed.endsWith(':') && !trimmed.includes(' ') && trimmed.length > 1) {
          const sectionName = trimmed.substring(0, trimmed.length - 1);
          currentSection = { name: sectionName, items: [], kvs: [], tables: [] };
          result.sections.push(currentSection);
          currentItem = null;
          currentSubKey = null;
          currentTableDef = null;
          continue;
        }
        
        // 计算缩进级别（在 currentSection 检查之前，因为需要处理表格数据）
        const indent = line.search(/\S/);
        
        // 如果当前有表格定义，优先检查是否是数据行
        if (currentTableDef) {
          // 检查是否是新的表格定义或章节标题（避免误判）
          const isNewTableDef = trimmed.match(/^([\w_]+)\[(\d+|N)\]\{([^}]+)\}:$/);
          const isSectionHeader = (line.search(/\S/) === 0 && trimmed.endsWith(':') && !trimmed.includes(' ') && trimmed.length > 1);
          
          // 数据行判断：不是新表格定义、不是章节标题、且有适当缩进
          // 对于顶级表格（indent=0），数据行可以是任意非空行（只要不是新定义）
          const isDataRow = !isNewTableDef && !isSectionHeader && !trimmed.startsWith('#') && 
                           (currentTableDef.indent === 0 ? indent >= 0 : indent > currentTableDef.indent);
          
          if (isDataRow) {
            // 解析逗号分隔的数据行
            const values = parseTableRow(trimmed, currentTableDef.fields);
            if (values.length > 0) {
              const rowData = {};
              currentTableDef.fields.forEach((field, idx) => {
                rowData[field] = values[idx] || '';
              });
              currentTableDef.items.push(rowData);
            }
            continue;
          } else if (isNewTableDef || isSectionHeader || trimmed === '') {
            // 表格数据结束（遇到新表格定义、章节标题或空行）
            currentTableDef = null;
            // 不要 continue，让后续逻辑处理
          }
        }
        
        if (!currentSection) continue;
        
        // 检测表格式列表定义: name[count]{field1,field2,...}: 或 name[N]{field1,field2,...}:
        // 支持缩进的表格定义（在章节内部）
        const tableDefMatch = trimmed.match(/^([\w_]+)\[(\d+|N)\]\{([^}]+)\}:$/);
        if (tableDefMatch) {
          const [, tableName, countStr, fieldsStr] = tableDefMatch;
          const count = countStr === 'N' ? -1 : parseInt(countStr);
          const fields = fieldsStr.split(',').map(f => f.trim());
          currentTableDef = { name: tableName, count, fields, items: [], indent };
          currentSection.tables.push(currentTableDef);
          currentItem = null;
          currentSubKey = null;
          continue;
        }
        
        // 列表项 - xxx
        if (trimmed.startsWith('- ')) {
          const itemContent = trimmed.substring(2);
          // 检查是否是 key:value 格式
          const colonIdx = itemContent.indexOf(':');
          if (colonIdx > 0) {
            const key = itemContent.substring(0, colonIdx).trim();
            const value = itemContent.substring(colonIdx + 1).trim();
            if (indent <= 2) {
              // 顶级列表项
              currentItem = { _id: key, _value: value, _children: [] };
              currentSection.items.push(currentItem);
              currentSubKey = null;
              currentSubItem = null;
            } else if (currentItem && currentSubKey) {
              // 子列表项 - 创建新的子项并保存引用
              if (!currentItem[currentSubKey]) currentItem[currentSubKey] = [];
              currentSubItem = { [key]: value };
              currentItem[currentSubKey].push(currentSubItem);
            } else if (currentItem) {
              currentItem._children.push({ key, value });
              currentSubItem = null;
            }
          } else {
            // 纯列表项
            if (currentItem && currentSubKey) {
              if (!currentItem[currentSubKey]) currentItem[currentSubKey] = [];
              currentSubItem = { _value: itemContent };
              currentItem[currentSubKey].push(currentSubItem);
            }
          }
          continue;
        }
        
        // 键值对 key:value
        const colonIdx = trimmed.indexOf(':');
        if (colonIdx > 0) {
          const key = trimmed.substring(0, colonIdx).trim();
          const value = trimmed.substring(colonIdx + 1).trim();
          
          if (indent <= 2 && !currentItem) {
            // 章节级别的键值对
            // 如果 value 为空或为 YAML 多行块标记 |，收集后续缩进的内容
            if (value === '' || value === '|') {
              // 收集所有后续缩进大于当前行的内容作为原始文本块
              const nestedLines = [];
              const baseIndent = indent;
              let j = i + 1;
              while (j < lines.length) {
                const nextLine = lines[j];
                const nextTrimmed = nextLine.trim();
                if (nextTrimmed === '') {
                  nestedLines.push('');
                  j++;
                  continue;
                }
                const nextIndent = nextLine.search(/\S/);
                if (nextIndent > baseIndent) {
                  nestedLines.push(nextLine);
                  j++;
                } else {
                  break;
                }
              }
              if (nestedLines.length > 0) {
                // 保存为原始文本块
                currentSection.kvs.push({ key, value: '', rawBlock: nestedLines.join('\n') });
                i = j - 1; // 跳过已处理的行
              } else {
                currentSection.kvs.push({ key, value });
              }
            } else {
              currentSection.kvs.push({ key, value });
            }
          } else if (currentItem) {
            if (value === '' || value === undefined) {
              // 这是一个子章节标题，如 methods:
              currentSubKey = key;
              currentSubItem = null;
              if (!currentItem[key]) currentItem[key] = [];
            } else if (currentSubItem && currentSubKey && indent > 4) {
              // 子列表项的属性（缩进大于4，属于当前子项）
              currentSubItem[key] = value;
            } else {
              // 普通键值对（属于顶级列表项）
              currentItem[key] = value;
              currentSubKey = null;
              currentSubItem = null;
            }
          }
        }
      }
      
      return result;
    }
    
    // 解析表格数据行，智能处理包含逗号的字段值
    // 支持双引号包裹的字段值（引号内的逗号不作为分隔符）
    function parseTableRow(line, fields) {
      if (!fields || fields.length === 0) {
        return line.split(',').map(p => p.trim());
      }
      
      const fieldCount = fields.length;
      const result = [];
      let remaining = line.trim();
      
      // 从左到右解析字段
      for (let i = 0; i < fieldCount; i++) {
        remaining = remaining.trimStart();
        
        if (remaining === '') {
          result.push('');
          continue;
        }
        
        // 检查是否以引号开头
        if (remaining.startsWith('"')) {
          // 查找闭合引号（跳过转义的引号）
          let endQuoteIdx = -1;
          for (let j = 1; j < remaining.length; j++) {
            if (remaining[j] === '"' && remaining[j-1] !== '\\') {
              endQuoteIdx = j;
              break;
            }
          }
          
          if (endQuoteIdx > 0) {
            // 提取引号内的内容
            const value = remaining.substring(1, endQuoteIdx);
            result.push(value);
            // 跳过引号和后面的逗号
            remaining = remaining.substring(endQuoteIdx + 1).trimStart();
            if (remaining.startsWith(',')) {
              remaining = remaining.substring(1);
            }
            continue;
          }
        }
        
        // 非引号包裹的字段
        if (i < fieldCount - 1) {
          // 非最后一个字段，按逗号分割
          const commaIdx = remaining.indexOf(',');
          if (commaIdx >= 0) {
            result.push(remaining.substring(0, commaIdx).trim());
            remaining = remaining.substring(commaIdx + 1);
          } else {
            result.push(remaining.trim());
            remaining = '';
          }
        } else {
          // 最后一个字段，取剩余全部内容
          result.push(remaining.trim());
          remaining = '';
        }
      }
      
      // 确保字段数量匹配
      while (result.length < fieldCount) {
        result.push('');
      }
      
      return result;
    }
    
    function renderToonFile(content) {
      if (!content) return '<div class="empty-state"><div class="icon">⚠️</div><div class="text">内容加载失败</div></div>';
      
      const parsed = parseToon(content);
      
      // 【调试】输出完整解析结果
      console.log('=== TOON 第一性原理调试 ===');
      console.log('1. 原始内容长度:', content.length);
      console.log('2. 解析后 sections 数量:', parsed.sections.length);
      parsed.sections.forEach((s, i) => {
        console.log(`   Section[${i}]: name="${s.name}", kvs=${s.kvs?.length || 0}, tables=${s.tables?.length || 0}, items=${s.items?.length || 0}`);
        if (s.tables) {
          s.tables.forEach((t, j) => {
            console.log(`     Table[${j}]: name="${t.name}", fields=[${t.fields.join(',')}], items=${t.items.length}`);
            if (t.items.length > 0) {
              console.log(`       第一条数据:`, t.items[0]);
            }
          });
        }
      });
      
      // 检查解析结果是否有效（至少有一个表格包含数据）
      const hasTableData = parsed.sections.some(s => 
        s.tables && s.tables.some(t => t.items.length > 0)
      );
      const hasKvData = parsed.sections.some(s => s.kvs && s.kvs.length > 0);
      const hasItemData = parsed.sections.some(s => s.items && s.items.length > 0);
      
      console.log('3. hasTableData:', hasTableData, 'hasKvData:', hasKvData, 'hasItemData:', hasItemData);
      
      // 如果解析失败或没有有效数据，显示原始内容
      if (parsed.sections.length === 0 || (!hasTableData && !hasKvData && !hasItemData)) {
        console.warn('[TOON] 解析结果为空，显示原始内容');
        return `
          <div class="card">
            <div class="card-title"><span class="icon">📄</span>TOON 原始内容</div>
            <pre class="code-preview"><code>${escapeHtml(content)}</code></pre>
          </div>
        `;
      }
      
      let html = '<div class="toon-container">';
      
      // 头部信息
      html += '<div class="toon-header">';
      html += `<h3>📋 ${parsed.comments[0] || 'TOON 文档'}</h3>`;
      if (parsed.comments.length > 1) {
        html += '<div class="toon-meta">';
        parsed.comments.slice(1).forEach(c => {
          html += `<span>${escapeHtml(c)}</span>`;
        });
        html += '</div>';
      }
      html += '</div>';
      
      // 各章节
      parsed.sections.forEach((section, idx) => {
        const isExpanded = true; // 默认全部展开
        const tableCount = (section.tables || []).reduce((sum, t) => sum + t.items.length, 0);
        const itemCount = section.items.filter(i => i._type !== 'subsection').length || section.kvs.length || tableCount;
        
        html += `<div class="toon-section ${isExpanded ? 'expanded' : ''}">`;
        html += `<div class="toon-section-title" onclick="this.parentElement.classList.toggle('expanded')">`;
        html += `${formatSectionName(section.name)}`;
        if (itemCount > 0) {
          html += `<span class="badge">${itemCount}</span>`;
        }
        html += '</div>';
        html += '<div class="toon-section-content">';
        
        // 渲染键值对
        if (section.kvs.length > 0) {
          section.kvs.forEach(kv => {
            if (kv.rawBlock) {
              // 尝试解析嵌套的服务依赖结构为表格
              const depHtml = renderNestedDependencies(kv.key, kv.rawBlock);
              if (depHtml) {
                html += depHtml;
              } else {
                // 检查是否是纯文本块（如 background: | 多行文本）
                const blockText = kv.rawBlock.split('\n').map(l => l.trim()).filter(l => l).join(' ');
                const looksLikeText = !kv.rawBlock.includes('{') && !kv.rawBlock.includes('[');
                if (looksLikeText && blockText.length > 0) {
                  html += `<div class="toon-kv">`;
                  html += `<span class="toon-kv-key">${formatKey(kv.key)}</span>`;
                  html += `<span class="toon-kv-value">${escapeHtml(blockText)}</span>`;
                  html += '</div>';
                } else {
                  html += `<div class="toon-nested-block">`;
                  html += `<div class="toon-nested-title">${formatKey(kv.key)}</div>`;
                  html += `<pre class="toon-nested-content"><code>${escapeHtml(kv.rawBlock)}</code></pre>`;
                  html += '</div>';
                }
              }
            } else {
              html += `<div class="toon-kv">`;
              html += `<span class="toon-kv-key">${formatKey(kv.key)}</span>`;
              html += `<span class="toon-kv-value">${formatValue(kv.key, kv.value)}</span>`;
              html += '</div>';
            }
          });
        }
        
        // 渲染表格式数据
        if (section.tables && section.tables.length > 0) {
          section.tables.forEach(table => {
            html += renderToonTable(table);
          });
        }
        
        // 渲染混合格式（function_assignments 等）
        if (section._mixed && section.items.length > 0) {
          html += '<div class="toon-table-scroll"><table class="toon-table">';
          html += '<thead><tr><th>功能ID</th><th>功能名称</th><th>服务</th><th>角色</th><th>动作</th><th>领域</th><th>流程环节</th></tr></thead>';
          html += '<tbody>';
          section.items.forEach(item => {
            if (item._type === 'single') {
              html += '<tr>';
              html += `<td><span class="id-badge">${escapeHtml(item._id)}</span></td>`;
              html += `<td>${escapeHtml(item._name)}</td>`;
              html += `<td><code class="toon-code-class">${escapeHtml(item.service)}</code></td>`;
              html += `<td><span class="toon-type-tag" style="background:#722ed120;color:#722ed1">${escapeHtml(item.role)}</span></td>`;
              html += `<td>${escapeHtml(item.action)}</td>`;
              html += `<td>${escapeHtml(item.domain)}</td>`;
              html += `<td>${escapeHtml(item.workflow)}</td>`;
              html += '</tr>';
            } else if (item._type === 'multi') {
              // 多服务分组：第一行显示功能ID和名称，合并单元格
              const svcCount = item._services.length;
              item._services.forEach((svc, si) => {
                html += '<tr>';
                if (si === 0) {
                  html += `<td rowspan="${svcCount}"><span class="id-badge">${escapeHtml(item._id)}</span></td>`;
                  html += `<td rowspan="${svcCount}">${escapeHtml(item._name)}</td>`;
                }
                html += `<td><code class="toon-code-class">${escapeHtml(svc.service)}</code></td>`;
                html += `<td><span class="toon-type-tag" style="background:${svc.role === 'provider' ? '#52c41a20;color:#52c41a' : '#722ed120;color:#722ed1'}">${escapeHtml(svc.role)}</span></td>`;
                html += `<td>${escapeHtml(svc.action)}</td>`;
                html += `<td>${escapeHtml(svc.domain)}</td>`;
                html += `<td>${escapeHtml(svc.workflow)}</td>`;
                html += '</tr>';
              });
            }
          });
          html += '</tbody></table></div>';
        }
        // 渲染列表项（包括子章节分隔）
        else if (section.items.length > 0) {
          let inList = false;
          section.items.forEach(item => {
            if (item._type === 'subsection') {
              if (inList) { html += '</ul>'; inList = false; }
              html += `<div class="toon-subsection-title">${escapeHtml(item._title)}</div>`;
            } else {
              if (!inList) { html += '<ul class="toon-list">'; inList = true; }
              html += renderToonItem(item, section.name);
            }
          });
          if (inList) html += '</ul>';
        }
        
        html += '</div></div>';
      });
      
      html += '</div>';
      return html;
    }
    
    // 解析嵌套结构为HTML
    // 格式1: service_name:\n  dubbo[N]{fields}:\n    data_row1\n    data_row2
    // 格式2: - key1:value1\n  key2:value2\n  key3:value3 (YAML列表)
    function renderNestedDependencies(key, rawBlock) {
      const lines = rawBlock.split('\n').filter(l => l.trim());
      if (lines.length === 0) return null;
      
      // 检查是否是 YAML 列表格式（以 - 开头的列表项）
      const hasYamlList = lines.some(l => l.trim().startsWith('- '));
      if (hasYamlList) {
        return renderYamlListAsCards(key, rawBlock);
      }
      
      // 检查是否包含 dubbo[ 或类似表格定义
      const hasDubboTable = lines.some(l => l.trim().match(/^\w+\[\d+\]\{[^}]+\}:$/));
      if (!hasDubboTable) return null;
      
      let html = `<div class="toon-table-wrapper">`;
      html += `<div class="toon-table-title">${formatKey(key)}</div>`;
      html += '<div class="toon-table-scroll"><table class="toon-table">';
      
      let currentTarget = '';
      let fields = [];
      let hasHeader = false;
      
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        
        // 目标服务名行: asp-storage-service:
        const targetMatch = trimmed.match(/^([\w\-\.]+):$/);
        if (targetMatch && !trimmed.match(/^\w+\[/)) {
          currentTarget = targetMatch[1];
          return;
        }
        
        // 表格定义行: dubbo[1]{caller_class,target_interfaces}:
        const tableDefMatch = trimmed.match(/^\w+\[(\d+)\]\{([^}]+)\}:$/);
        if (tableDefMatch) {
          fields = tableDefMatch[2].split(',').map(f => f.trim());
          if (!hasHeader) {
            html += '<thead><tr><th>目标服务</th>';
            fields.forEach(f => { html += `<th>${formatKey(f)}</th>`; });
            html += '</tr></thead><tbody>';
            hasHeader = true;
          }
          return;
        }
        
        // 数据行
        if (fields.length > 0 && !trimmed.startsWith('#')) {
          const values = trimmed.split(',').map(v => v.trim());
          html += '<tr>';
          html += `<td><code class="toon-code-class">${escapeHtml(currentTarget)}</code></td>`;
          fields.forEach((f, idx) => {
            const val = values[idx] || '';
            if (val.includes('|')) {
              html += `<td>${val.split('|').map(v => `<code class="toon-code-method">${escapeHtml(v.trim())}</code>`).join(' ')}</td>`;
            } else {
              html += `<td>${escapeHtml(val)}</td>`;
            }
          });
          html += '</tr>';
        }
      });
      
      if (!hasHeader) return null;
      html += '</tbody></table></div></div>';
      return html;
    }
    
    // 渲染嵌套结构为HTML（通用，不含硬编码业务标识）
    // 支持三种格式:
    // 1. YAML列表: - key1:value1\n  key2:value2
    // 2. 纯文本列表: - 文本内容1\n- 文本内容2
    // 3. 纯键值对: key1:value1\nkey2:value2
    function renderYamlListAsCards(key, rawBlock) {
      const lines = rawBlock.split('\n');
      const items = [];
      let currentItem = null;
      let isSimpleList = false; // 纯文本列表
      let isKvBlock = false; // 纯键值对块
      
      // 先判断类型
      const hasListItem = lines.some(l => l.trim().startsWith('- '));
      if (!hasListItem) {
        // 纯键值对块
        isKvBlock = true;
      } else {
        // 检查是否是纯文本列表（- 后面不含冒号）
        const listLines = lines.filter(l => l.trim().startsWith('- '));
        isSimpleList = listLines.every(l => {
          const content = l.trim().substring(2);
          return !content.includes(':') || content.indexOf(':') > 20; // 冒号在很后面，可能是描述文本
        });
      }
      
      if (isKvBlock) {
        // 渲染为键值对表格
        let html = '<div class="toon-yaml-list">';
        html += `<div class="toon-yaml-list-title">${formatKey(key)}</div>`;
        html += '<div class="toon-list-item-body">';
        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) return;
          const colonIdx = trimmed.indexOf(':');
          if (colonIdx > 0) {
            const k = trimmed.substring(0, colonIdx).trim();
            const v = trimmed.substring(colonIdx + 1).trim();
            html += `<div class="toon-kv">`;
            html += `<span class="toon-kv-key">${formatKey(k)}</span>`;
            html += `<span class="toon-kv-value">${formatValue(k, v)}</span>`;
            html += '</div>';
          }
        });
        html += '</div></div>';
        return html;
      }
      
      if (isSimpleList) {
        // 渲染为简单文本列表
        let html = '<div class="toon-yaml-list">';
        const textItems = lines.filter(l => l.trim().startsWith('- ')).map(l => l.trim().substring(2));
        html += `<div class="toon-yaml-list-title">${formatKey(key)} <span class="badge">${textItems.length}</span></div>`;
        html += '<ul class="toon-simple-list">';
        textItems.forEach(text => {
          html += `<li class="toon-simple-list-item">${escapeHtml(text)}</li>`;
        });
        html += '</ul></div>';
        return html;
      }
      
      // YAML 列表（- key:value 格式）
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        
        if (trimmed.startsWith('- ')) {
          // 新列表项开始
          if (currentItem) items.push(currentItem);
          currentItem = {};
          const content = trimmed.substring(2);
          const colonIdx = content.indexOf(':');
          if (colonIdx > 0) {
            const k = content.substring(0, colonIdx).trim();
            const v = content.substring(colonIdx + 1).trim();
            currentItem[k] = v;
          }
        } else if (currentItem) {
          // 继续当前列表项的属性
          const colonIdx = trimmed.indexOf(':');
          if (colonIdx > 0) {
            const k = trimmed.substring(0, colonIdx).trim();
            const v = trimmed.substring(colonIdx + 1).trim();
            currentItem[k] = v;
          }
        }
      });
      if (currentItem) items.push(currentItem);
      
      if (items.length === 0) return null;
      
      let html = '<div class="toon-yaml-list">';
      html += `<div class="toon-yaml-list-title">${formatKey(key)} <span class="badge">${items.length}</span></div>`;
      html += '<ul class="toon-list">';
      
      items.forEach(item => {
        html += '<li class="toon-list-item">';
        html += '<div class="toon-list-item-header">';
        // 获取第一个属性作为标题
        const keys = Object.keys(item);
        if (keys.length > 0) {
          html += `<span class="id-badge">${escapeHtml(keys[0])}</span>`;
          html += `<span class="name">${escapeHtml(item[keys[0]])}</span>`;
        }
        html += '</div>';
        html += '<div class="toon-list-item-body">';
        // 渲染其他属性
        keys.slice(1).forEach(k => {
          html += `<div class="toon-kv">`;
          html += `<span class="toon-kv-key">${formatKey(k)}</span>`;
          html += `<span class="toon-kv-value">${formatValue(k, item[k])}</span>`;
          html += '</div>';
        });
        html += '</div></li>';
      });
      
      html += '</ul></div>';
      return html;
    }
    
    // 渲染表格式数据
    function renderToonTable(table) {
      let html = `<div class="toon-table-wrapper">`;
      html += `<div class="toon-table-title">${formatTableName(table.name)} <span class="badge">${table.items.length}</span></div>`;
      
      if (table.items.length === 0) {
        html += '<div class="toon-empty">暂无数据</div>';
      } else {
        html += '<div class="toon-table-scroll"><table class="toon-table">';
        // 表头
        html += '<thead><tr>';
        table.fields.forEach(field => {
          html += `<th>${formatKey(field)}</th>`;
        });
        html += '</tr></thead>';
        // 表体
        html += '<tbody>';
        table.items.forEach(row => {
          html += '<tr>';
          table.fields.forEach(field => {
            const val = row[field] || '';
            html += `<td>${formatTableCell(field, val)}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';
      return html;
    }
    
    function formatTableName(name) {
      const labels = {
        'interfaces': '🔌 接口列表',
        'provider_classes': '📦 Provider 类',
        'service_classes': '🔧 Service 类',
        'gateway_classes': '🌐 Gateway 类',
        'methods': '📝 方法列表',
        'core_framework': '🛠️ 核心框架',
        'request_dtos': '📥 请求对象',
        'response_dtos': '📤 响应对象',
        'method_calls': '🔗 方法调用链',
        'dubbo_dependencies': '🔌 Dubbo 依赖',
        'mq_consumers': '📨 MQ 消费者',
        'mq_producers': '📤 MQ 生产者',
        'redis_usage': '💾 Redis 使用',
        'internal_services': '🏠 内部服务',
        'gateway_dependencies': '🌐 Gateway 依赖',
        'enums': '📋 枚举类',
        'scheduled_tasks': '⏰ 定时任务',
        'tables': '🗄️ 数据库表',
        'fields': '📝 字段列表',
        'conflicts': '⚠️ 冲突问题',
        'code_evidence': '📌 代码证据',
        // 原子功能 TOON 表格
        'USER_PAIN_POINTS': '😣 用户痛点',
        'RELATED_SYSTEMS': '🔗 关联系统',
        'HIGH_RISK_ITEMS': '⚠️ 高危项',
        'MODULES': '📦 功能模块',
        'FUNCTIONS': '⚡ 原子功能',
        'BUSINESS_RULES': '📏 业务规则',
        'RISKS': '⚠️ 风险项',
        'QUESTIONS': '❓ 待澄清问题',
        'GLOSSARY': '📖 术语表',
        'DATA_ENTITIES': '🗃️ 数据实体',
        'BUSINESS_FLOWS': '🔄 业务流程',
        'EXTERNAL_INTERFACES': '🌐 外部接口',
        'PRD_MAPPING': '🔗 PRD映射'
      };
      return labels[name] || name;
    }
    
    function formatTableCell(field, value) {
      if (!value || value === '-' || value === '[冲突:未发现]') {
        return '<span style="color:#bfbfbf">-</span>';
      }
      
      // 文件路径
      if (field === 'file_path' || field === 'implementation') {
        if (value.includes('.java')) {
          return `<code class="toon-code-path">${escapeHtml(value)}</code>`;
        }
        return escapeHtml(value);
      }
      
      // 类名
      if (field === 'class_name' || field === 'interface_implementation' || field === 'dto_name' || field === 'enum_name') {
        return `<code class="toon-code-class">${escapeHtml(value)}</code>`;
      }
      
      // 包路径
      if (field === 'package') {
        return `<span style="color:#8c8c8c;font-size:11px">${escapeHtml(value)}</span>`;
      }
      
      // 方法列表（逗号分隔）- 直接显示全部
      if (field === 'methods' || field === 'called_methods') {
        const methods = value.split(',').map(m => m.trim()).filter(Boolean);
        return methods.map(m => `<code class="toon-code-method">${escapeHtml(m)}</code>`).join(' ');
      }
      
      // 数字
      if (field === 'line' || field === 'line_number' || field === 'methods_count') {
        return `<span style="color:#1890ff">${escapeHtml(value)}</span>`;
      }
      
      // 类型标签
      if (field === 'interface_type' || field === 'rw_type' || field === 'severity') {
        const colors = {
          'dubbo': '#722ed1', 'http': '#1890ff', 'mq': '#52c41a',
          'read': '#52c41a', 'write': '#ff4d4f', 'read_write': '#faad14',
          'HIGH': '#ff4d4f', 'MEDIUM': '#faad14', 'LOW': '#52c41a'
        };
        const color = colors[value] || '#8c8c8c';
        return `<span class="toon-type-tag" style="background:${color}20;color:${color}">${escapeHtml(value)}</span>`;
      }
      
      return escapeHtml(value);
    }
    
    // 通用 TOON 列表项渲染器 - 不包含任何硬编码的业务标识
    function renderToonItem(item, sectionName) {
      let html = '<li class="toon-list-item">';
      
      // 头部：显示 _id 和 _value
      html += '<div class="toon-list-item-header">';
      if (item._id) {
        html += `<span class="id-badge">${escapeHtml(item._id)}</span>`;
        html += `<span class="name">${escapeHtml(item._value || '')}</span>`;
      }
      html += '</div>';
      
      // 主体内容
      html += '<div class="toon-list-item-body">';
      
      // 渲染所有普通属性（排除内部字段和数组）
      const skipKeys = ['_id', '_value', '_children'];
      Object.keys(item).forEach(key => {
        if (skipKeys.includes(key)) return;
        const val = item[key];
        if (Array.isArray(val)) return; // 子列表单独处理
        html += `<div class="toon-kv">`;
        html += `<span class="toon-kv-key">${formatKey(key)}</span>`;
        html += `<span class="toon-kv-value">${formatValue(key, val)}</span>`;
        html += '</div>';
      });
      
      // 渲染 _children
      if (item._children && item._children.length > 0) {
        item._children.forEach(child => {
          html += `<div class="toon-kv">`;
          html += `<span class="toon-kv-key">${formatKey(child.key)}</span>`;
          html += `<span class="toon-kv-value">${formatValue(child.key, child.value)}</span>`;
          html += '</div>';
        });
      }
      
      // 通用渲染所有数组类型的子列表
      Object.keys(item).forEach(key => {
        if (skipKeys.includes(key)) return;
        const val = item[key];
        if (!Array.isArray(val) || val.length === 0) return;
        
        html += '<div class="toon-methods">';
        html += `<div class="toon-methods-title">${formatKey(key)} (${val.length})</div>`;
        val.forEach(subItem => {
          html += '<div class="toon-method">';
          // 获取第一个非空属性作为标题
          const firstKey = Object.keys(subItem).find(k => subItem[k] && !k.startsWith('_'));
          if (firstKey) {
            html += `<div class="toon-method-name">${escapeHtml(subItem[firstKey])}</div>`;
          }
          // 渲染其他属性
          html += '<div class="toon-method-meta">';
          const metaParts = [];
          Object.keys(subItem).forEach(k => {
            if (k === firstKey) return;
            const v = subItem[k];
            if (v && v !== '-') {
              metaParts.push(`${formatKey(k)}: ${escapeHtml(v)}`);
            }
          });
          html += metaParts.join(' | ');
          html += '</div></div>';
        });
        html += '</div>';
      });
      
      html += '</div></li>';
      return html;
    }

    function formatValue(key, value) {
      if (!value || value === '-') return '<span style="color:#bfbfbf">-</span>';
      
      // 文件路径高亮
      if (key === 'file_path' || key === 'detail_file') {
        if (value.startsWith('[')) return `<span style="color:#bfbfbf">${escapeHtml(value)}</span>`;
        return `<code style="background:#f5f5f5;padding:2px 6px;border-radius:3px;font-size:11px">${escapeHtml(value)}</code>`;
      }
      
      // 类名/包名
      if (key === 'class_name' || key === 'package') {
        return `<code style="color:#722ed1;font-size:11px">${escapeHtml(value)}</code>`;
      }
      
      // 布尔值
      if (value === '✓') return '<span style="color:#52c41a">✓ 是</span>';
      if (value === '✗') return '<span style="color:#bfbfbf">✗ 否</span>';
      
      return escapeHtml(value);
    }
    
    // ==================== 表格增强 ====================
    let tableIdCounter = 0;
    function enhanceTables() {
      document.querySelectorAll('.markdown-body table').forEach(table => {
        if (table.dataset.enhanced) return;
        table.dataset.enhanced = 'true';
        
        const thead = table.querySelector('thead');
        const tbody = table.querySelector('tbody');
        if (!thead || !tbody) return;
        
        const rows = Array.from(tbody.querySelectorAll('tr'));
        if (rows.length < 5) return;
        
        const tableId = 'table-' + (++tableIdCounter);
        table.id = tableId;
        
        const wrapper = document.createElement('div');
        wrapper.className = 'filterable-table-wrapper';
        
        const filterRow = document.createElement('div');
        filterRow.className = 'table-filter-row';
        filterRow.innerHTML = `
          <span class="table-filter-label">🔍 筛选:</span>
          <input type="text" class="table-filter-input" placeholder="输入关键词..." data-table="${tableId}">
          <button class="table-filter-clear" data-table="${tableId}">清除</button>
          <span class="table-filter-count" data-table="${tableId}">共 ${rows.length} 行</span>
        `;
        
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(filterRow);
        wrapper.appendChild(table);
        
        const input = filterRow.querySelector('.table-filter-input');
        const clearBtn = filterRow.querySelector('.table-filter-clear');
        const countSpan = filterRow.querySelector('.table-filter-count');
        
        input.addEventListener('input', () => {
          const keyword = input.value.toLowerCase().trim();
          let visibleCount = 0;
          
          rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            if (!keyword || text.includes(keyword)) {
              row.classList.remove('table-row-hidden');
              visibleCount++;
            } else {
              row.classList.add('table-row-hidden');
            }
          });
          
          countSpan.textContent = keyword ? `显示 ${visibleCount}/${rows.length} 行` : `共 ${rows.length} 行`;
        });
        
        clearBtn.addEventListener('click', () => {
          input.value = '';
          rows.forEach(row => row.classList.remove('table-row-hidden'));
          countSpan.textContent = `共 ${rows.length} 行`;
        });
      });
    }

    // ==================== 资产对比查看器 ====================
    const AssetViewer = {
      overlay: null,
      imageContainer: null,
      mdContainer: null,
      titleEl: null,
      subtitleEl: null,

      init() {
        const html = `
          <div class="asset-viewer-overlay" id="assetViewerOverlay">
            <div class="asset-viewer-modal">
              <div class="asset-viewer-header">
                <div class="asset-viewer-title">
                  <div class="title-icon">🔍</div>
                  <div class="title-text">
                    <div class="title-main" id="assetViewerTitle">资产解析对比</div>
                    <div class="title-sub" id="assetViewerSubtitle">图片路径</div>
                  </div>
                </div>
                <button class="asset-viewer-btn close" id="assetViewerClose" title="关闭">✕</button>
              </div>
              <div class="asset-viewer-body">
                <div class="asset-viewer-left">
                  <div class="asset-viewer-panel-header">
                    <span class="panel-title">🖼️ 原始图片</span>
                    <span class="panel-badge">SOURCE</span>
                  </div>
                  <div class="asset-viewer-image-container" id="assetViewerImage"></div>
                </div>
                <div class="asset-viewer-right">
                  <div class="asset-viewer-panel-header">
                    <span class="panel-title">📝 AI 解析结果</span>
                    <span class="panel-badge">ANALYSIS</span>
                  </div>
                  <div class="asset-viewer-md-container" id="assetViewerMd"></div>
                </div>
              </div>
            </div>
          </div>
        `;
        document.body.insertAdjacentHTML('beforeend', html);

        this.overlay = document.getElementById('assetViewerOverlay');
        this.imageContainer = document.getElementById('assetViewerImage');
        this.mdContainer = document.getElementById('assetViewerMd');
        this.titleEl = document.getElementById('assetViewerTitle');
        this.subtitleEl = document.getElementById('assetViewerSubtitle');

        document.getElementById('assetViewerClose').addEventListener('click', () => this.close());
        this.overlay.addEventListener('click', (e) => { if (e.target === this.overlay) this.close(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.overlay.classList.contains('active')) this.close(); });
      },

      async open(imageUrl, mdUrl) {
        this.subtitleEl.textContent = imageUrl;
        this.overlay.classList.add('active');

        this.imageContainer.innerHTML = '<div class="image-placeholder"><div class="placeholder-icon">🖼️</div><div>加载图片中...</div></div>';
        this.mdContainer.innerHTML = '<div class="asset-viewer-loading"><div class="spinner"></div><div>加载解析结果...</div></div>';

        await Promise.all([this.loadImage(imageUrl), this.loadMd(mdUrl)]);
      },

      async loadImage(url) {
        try {
          const img = new Image();
          img.src = url;
          await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
          this.imageContainer.innerHTML = '';
          this.imageContainer.appendChild(img);
        } catch (e) {
          this.imageContainer.innerHTML = '<div class="image-placeholder"><div class="placeholder-icon">❌</div><div style="color:#ef4444;">图片加载失败</div></div>';
        }
      },

      async loadMd(url) {
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('文件加载失败');
          const content = await response.text();
          this.mdContainer.innerHTML = '<div class="markdown-body">' + marked.parse(content) + '</div>';
        } catch (e) {
          this.mdContainer.innerHTML = '<div class="asset-viewer-error"><div style="font-size:40px;margin-bottom:12px;">❌</div><div>加载失败</div></div>';
        }
      },

      close() {
        this.overlay.classList.remove('active');
      }
    };

    window.openAssetViewer = function(imageUrl, mdUrl) {
      AssetViewer.open(imageUrl, mdUrl);
    };

    // 增强资产汇总表格：将"查看"链接转换为按钮
    function enhanceAssetTable(container) {
      container.querySelectorAll('table').forEach(table => {
        const headers = table.querySelectorAll('th');
        let imageColIdx = -1, resultColIdx = -1;
        headers.forEach((th, idx) => {
          const text = th.textContent.trim();
          if (text === '图片') imageColIdx = idx;
          if (text === '结果文件') resultColIdx = idx;
        });
        if (imageColIdx === -1 || resultColIdx === -1) return;

        // 修改表头：将"结果文件"改为"操作"并移到最后
        const headerRow = table.querySelector('thead tr') || table.querySelector('tr');
        if (headerRow) {
          const resultTh = headerRow.children[resultColIdx];
          if (resultTh) {
            resultTh.textContent = '操作';
            headerRow.appendChild(resultTh);
          }
        }

        // 处理每一行
        table.querySelectorAll('tbody tr, tr:not(:first-child)').forEach(row => {
          const cells = row.querySelectorAll('td');
          if (cells.length <= Math.max(imageColIdx, resultColIdx)) return;

          const imageCell = cells[imageColIdx];
          const resultCell = cells[resultColIdx];

          const imageCode = imageCell.querySelector('code');
          const imagePath = imageCode ? imageCode.textContent.trim() : '';
          
          // 从 onclick 属性中提取 MD 路径（因为 renderMarkdown 已经转换了链接）
          const mdLink = resultCell.querySelector('a');
          let mdHref = '';
          if (mdLink) {
            const onclick = mdLink.getAttribute('onclick') || '';
            const match = onclick.match(/navigateToFile\('([^']+)'\)/);
            if (match) {
              mdHref = match[1];
            }
          }

          if (imagePath && mdHref) {
            // 从 MD 路径推断图片完整路径
            // mdHref: P01_req_intake/assets_analysis/xxx.md
            // imagePath: source_export/static/xxx.png
            const mdBasePath = mdHref.substring(0, mdHref.indexOf('assets_analysis/'));
            const fullImagePath = mdBasePath + imagePath;

            // 检查 MD 文件是否存在
            fetch(mdHref, { method: 'HEAD' }).then(res => {
              if (res.ok) {
                resultCell.innerHTML = `<span style="color:#10b981;margin-right:8px;">✓</span><button onclick="openAssetViewer('${fullImagePath}', '${mdHref}')" style="padding:4px 12px;font-size:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:500;">🔍 查看</button>`;
              } else {
                resultCell.innerHTML = '<span style="color:#ef4444;">✗</span>';
              }
            }).catch(() => {
              resultCell.innerHTML = '<span style="color:#ef4444;">✗</span>';
            });

            row.appendChild(resultCell);
          }
        });
      });
    }
